<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>jdev-ai</title>
    <style>
      /* Pantalla de arranque: colores del tema Carbón, fijos porque los ajustes
         del panel aún no se conocen. Sin fuentes ni recursos externos. */
      :root {
        color-scheme: dark;
        --bg: #09090a;
        --fg: #ececee;
        --fg-muted: #8e8e96;
        --fg-faint: #7d7d85;
        --line: #1f1f23;
        --accent: #f0b25a;
        --danger: #ff8f80;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        width: min(44rem, 100%);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        animation: entra 0.4s ease-out both;
      }
      .logo {
        margin: 0;
        font: 700 2.25rem/1 'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .logo__tilde {
        color: var(--fg-faint);
      }
      .logo__cursor {
        display: inline-block;
        width: 0.5em;
        height: 1em;
        margin-left: 0.12em;
        vertical-align: -0.12em;
        border-radius: 1px;
        background: var(--accent);
        animation: parpadea 1.1s steps(1, end) infinite;
      }
      .barra {
        position: relative;
        width: 11rem;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--line);
      }
      .barra::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: var(--fg-muted);
        animation: avanza 1.4s ease-in-out infinite;
      }
      .estado {
        margin: 0;
        font-size: 0.85rem;
        color: var(--fg-muted);
      }
      .detalle {
        width: 100%;
        margin: 0;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #0e0e10;
        color: #c9c9ce;
        font: 0.82rem/1.55 'Cascadia Mono', Consolas, ui-monospace, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      /* Si el arranque falla: sin animaciones de espera y con el motivo a la vista. */
      .fallo .barra {
        display: none;
      }
      .fallo .estado {
        color: var(--danger);
        font-size: 1rem;
        font-weight: 600;
      }
      .fallo .logo__cursor {
        animation: none;
        background: var(--fg-faint);
      }
      @keyframes parpadea {
        50% {
          opacity: 0;
        }
      }
      @keyframes avanza {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @keyframes entra {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main,
        .logo__cursor,
        .barra::after {
          animation: none;
        }
        .barra::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main id="arranque">
      <h1 class="logo"><span class="logo__tilde">~/</span>jdev-ai<span class="logo__cursor" aria-hidden="true"></span></h1>
      <div class="barra" aria-hidden="true"></div>
      <p class="estado" id="estado" role="status">Arrancando el panel…</p>
      <pre class="detalle" id="detalle" hidden></pre>
    </main>
    <script>
      // La llama el programa si el servidor del panel no arranca.
      window.mostrarError = (texto) => {
        document.getElementById('arranque').classList.add('fallo');
        document.getElementById('estado').textContent = 'No se pudo arrancar el panel';
        const detalle = document.getElementById('detalle');
        detalle.textContent = texto;
        detalle.hidden = false;
      };
    </script>
  </body>
</html>
