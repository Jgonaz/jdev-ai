[package]
name = "jdev-ai-desktop"
version = "0.1.0"
description = "Programa de escritorio del panel de jdev-ai"
edition = "2021"
publish = false

[[bin]]
name = "jdev-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[lints.rust]
# El SDK de Windows que descarga cargo-xwin no trae los .pdb: el enlazador avisa por cada objeto.
linker_messages = "allow"
