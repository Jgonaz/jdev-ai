# Configuración del servidor tmux del panel gráfico (tmux -L jdev -f panel/tmux.conf).
# No cambia el prefijo (Ctrl+b) para que, al adjuntarse desde otra terminal, tmux
# se comporte como de costumbre.

# El panel ya muestra el estado de cada sesión: la barra de tmux sobra.
set -g status off

# Ratón: rueda para el historial y selección dentro de tmux.
set -g mouse on

# Selección con el ratón: al soltar, tmux copia sin borrar la selección (por
# defecto la copia a su buffer y la quita, y parece que no se ha copiado nada).
# Con set-clipboard (por defecto «external») tmux manda el texto al cliente con
# OSC 52 y el panel lo pasa al portapapeles del sistema. La selección sigue en
# copy-mode: Escape o q vuelven a la aplicación y, desde el panel, también
# escribir (su servidor cancela copy-mode antes de pasar la tecla; ver
# leaveCopyMode en panel/server/tmux.ts).
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    DoubleClick1Pane  select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode    TripleClick1Pane  select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; send -X copy-pipe-no-clear }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line ; send -X copy-pipe-no-clear }

# Sin el menú de tmux con el botón derecho: se abría junto al del navegador y
# ofrece acciones (Kill, Respawn, dividir) que no encajan en el panel. Si la
# aplicación pide el ratón, el clic derecho le sigue llegando.
bind -n MouseDown3Pane if -F "#{mouse_any_flag}" { select-pane -t = ; send -M } {}
unbind -n M-MouseDown3Pane

# Sin retraso al pulsar Escape (importante para vim y para los agentes).
set -s escape-time 0

# Claude Code usa los eventos de foco para saber si la terminal está a la vista;
# sin esto avisa en su barra inferior.
set -g focus-events on

set -g default-terminal "tmux-256color"
# Color de 24 bits para los clientes del panel (xterm.js).
set -sa terminal-features ",xterm-256color:RGB"

# Valor por defecto; el servidor del panel lo sobrescribe al crear cada sesión
# con el ajuste de scroll de la pantalla Ajustes.
set -g history-limit 5000

# Si el agente termina (o bin/agent falla al validar), la sesión sigue ahí con su
# salida en lugar de desaparecer: el panel la muestra como terminada y se retira
# de forma explícita.
set -g remain-on-exit on

# Historial con la rueda y el teclado. En el panel cada terminal es un cliente de
# tmux, así que el historial lo tiene tmux (no xterm.js): la rueda entra en
# copy-mode y avanza 1 línea por muesca; se fija en 5 en ambos modos para que
# recorrer miles de líneas sea ágil.
# Primera muesca fuera de copy-mode: entra y ya avanza 5 (igual que la binding por
# defecto, que solo entraba). Si la aplicación pide el ratón, se lo pasa.
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -e ; send -X -N 5 scroll-up }
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 5 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 5 scroll-down

# Mayús+RePág entra en copy-mode una página arriba (-e: sale solo al llegar al
# final del historial); dentro de copy-mode, Mayús+RePág/AvPág pasan de página.
# RePág y AvPág sin Mayús siguen llegando a la aplicación. Si la aplicación usa la
# pantalla alternativa (Claude Code a pantalla completa, vim, less), tmux no tiene
# historial: Mayús+RePág/AvPág le llegan como RePág/AvPág, que es su scroll.
#
# La configuración solo se lee al arrancar el servidor tmux. Para aplicarla a uno ya
# arrancado: tmux -L jdev source-file panel/tmux.conf
bind -n S-PPage if -F "#{alternate_on}" { send-keys PPage } { copy-mode -eu }
bind -n S-NPage if -F "#{alternate_on}" { send-keys NPage } { send-keys S-NPage }
bind -T copy-mode    S-PPage send -X page-up
bind -T copy-mode    S-NPage send -X page-down
bind -T copy-mode-vi S-PPage send -X page-up
bind -T copy-mode-vi S-NPage send -X page-down
